    <script>
      // Aplica o tema salvo (claro/escuro) antes de desenhar a tela
      try {
        var t = localStorage.getItem('mentor-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Volta para a página certa depois de um recarregamento no GitHub Pages (ver 404.html)
      try {
        var r = sessionStorage.getItem('mentor-redirect');
        if (r) { sessionStorage.removeItem('mentor-redirect'); history.replaceState(null, '', r); }
      } catch (e) {}
    </script>
